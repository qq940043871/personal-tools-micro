<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECharts 中国地图示例</title>
    <!-- 引入ECharts的CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        #map-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            margin-top: 20px;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ECharts 中国地图示例</h1>
        <div id="map-container"></div>
        <div class="info">
            <h3>说明</h3>
            <p>本示例使用ECharts展示中国地图，包含基本的地图渲染和交互功能。</p>
            <p>由于VChart的CDN链接暂时无法访问，这里使用ECharts作为替代方案。</p>
        </div>
    </div>

    <script>
        // 显示加载中信息
        document.getElementById('map-container').innerHTML = '<p style="text-align: center; padding: 100px; color: #666;">地图数据加载中...</p>';

        // 简化版中国地图数据（ECharts兼容格式）
        const chinaMapData = {
            type: 'FeatureCollection',
            features: [
                {
                    type: 'Feature',
                    properties: { name: '北京' },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[
                            [115.4, 39.4], [117.4, 39.4], [117.4, 41.4], [115.4, 41.4], [115.4, 39.4]
                        ]]
                    }
                },
                {
                    type: 'Feature',
                    properties: { name: '上海' },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[
                            [120.4, 30.4], [122.4, 30.4], [122.4, 32.4], [120.4, 32.4], [120.4, 30.4]
                        ]]
                    }
                },
                {
                    type: 'Feature',
                    properties: { name: '广东' },
                    geometry: {
                        type: 'Polygon',
                        coordinates: [[
                            [109.4, 20.4], [117.4, 20.4], [117.4, 25.4], [109.4, 25.4], [109.4, 20.4]
                        ]]
                    }
                }
            ]
        };

        // 初始化ECharts实例
        let myChart;

        // 注册地图数据并显示图表
        try {
            // 注册地图数据
            echarts.registerMap('china', chinaMapData);
            console.log('地图数据注册成功');
            
            // 清空容器并创建ECharts实例
            document.getElementById('map-container').innerHTML = '';
            myChart = echarts.init(document.getElementById('map-container'));
            console.log('ECharts实例创建成功');
            
            // 基本地图配置
            const option = {
                title: {
                    text: '中国地图示例',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'item',
                    formatter: '{b}'
                },
                series: [
                    {
                        name: '中国地图',
                        type: 'map',
                        map: 'china',
                        roam: true,
                        label: {
                            show: true
                        },
                        data: [
                            { name: '北京', value: 100 },
                            { name: '上海', value: 100 },
                            { name: '广东', value: 100 }
                        ]
                    }
                ]
            };
            
            // 设置选项
            myChart.setOption(option);
            console.log('地图配置设置成功');
            
        } catch (error) {
            console.error('地图初始化失败:', error);
            document.getElementById('map-container').innerHTML = '<p style="text-align: center; padding: 100px; color: red;">地图初始化失败，请检查控制台错误</p>';
        }

        // 监听窗口大小变化，自适应调整图表
        window.addEventListener('resize', () => {
            if (myChart) {
                myChart.resize();
            }
        });
    </script>
</body>
</html>
